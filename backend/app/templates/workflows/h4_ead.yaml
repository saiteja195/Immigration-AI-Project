id: h4_ead
title: Apply for H-4 EAD
description: Work permit for some H-4 spouses. You usually qualify if the H-1B spouse has an approved I-140 or an H-1B extension beyond 6 years.
applies_to: [H-4]
last_verified: 2026-10-16
sources:
  - {name: "USCIS - I-765", url: "https://www.uscis.gov/i-765"}
steps:
  - {title: "Check you are eligible", details: "Your spouse needs an approved I-140, or H-1B time extended past 6 years.", due_in_days: 0}
  - {title: "Gather documents", details: "Marriage certificate, your passport and I-94, your spouse's latest I-797 (and I-140 approval), and passport photos.", due_in_days: 10, required_docs: ["I-765", "Marriage certificate", "Passport", "I-94", "Spouse's I-797 and I-140 approval", "Passport photos x2", "Filing fee"]}
  - {title: "File Form I-765 (category C26)", details: "File online or by mail, with the fee.", due_in_days: 21}
  - {title: "Biometrics appointment", details: "Attend if USCIS sends a notice.", due_in_days: 50}
  - {title: "Receive the EAD card", details: "Do not start work before the start date on the card.", due_in_days: 120}
  - {title: "Set a renewal reminder", details: "USCIS accepts renewals up to 180 days before expiry. Do not wait for the last minute.", due_in_days: 130}
